server {
    server_name vinix-os.org www.vinix-os.org;

    # Do not proxy images through Veb.  Its static response path closes large
    # files early (while retaining the full Content-Length), which makes the
    # browser report otherwise-valid PNGs as broken.  Nginx streams these
    # assets directly from the deployment directory instead.
    location /assets/ {
        alias /var/www/vinix-os.org/assets/;
    }

    location / {
        proxy_pass http://127.0.0.1:8095;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ /\. {
        deny all;
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/vinix-os.org/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/vinix-os.org/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    listen 80;
    listen [::]:80;
    server_name vinix-os.org www.vinix-os.org;

    # /version answers over plain HTTP as well. A client that does not follow
    # redirects (curl without -L, a small HTTP client) would otherwise get the
    # redirect page instead of the release tag. Everything else moves to HTTPS.
    location = /version {
        proxy_pass http://127.0.0.1:8095;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
